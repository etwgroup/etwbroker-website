<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="ETW Broker — panel klienta w przygotowaniu.">
    <meta name="theme-color" content="#940916">
    <title>Panel klienta w przygotowaniu | ETW Broker</title>
    <link rel="icon" type="image/png" href="etw-broker-logo.png">
    <link rel="apple-touch-icon" href="etw-broker-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
      :root { --ink:#171719; --red:#bc0027; --red-deep:#810019; --rose:#ef1744; --paper:#f7f7f5; --white:#fff; --max:1180px; }
      * { box-sizing:border-box; }
      html { min-height:100%; }
      body { min-height:100vh; margin:0; overflow-x:hidden; color:var(--ink); background:var(--paper); font:16px/1.55 "DM Sans",sans-serif; -webkit-font-smoothing:antialiased; }
      body::before, body::after { content:""; position:fixed; z-index:-1; pointer-events:none; }
      body::before { top:-170px; right:-130px; width:520px; height:520px; background:linear-gradient(145deg,var(--rose),var(--red-deep)); clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%); transform:rotate(17deg); opacity:.96; }
      body::after { bottom:-190px; left:-160px; width:500px; height:500px; border:64px solid rgba(188,0,39,.1); border-radius:50%; }
      .wrap { width:min(var(--max),calc(100% - 48px)); margin-inline:auto; }
      .topline { height:5px; background:linear-gradient(90deg,var(--red-deep),var(--rose) 51%,var(--red-deep)); }
      .header { background:#1b1113; color:var(--white); }
      .nav { min-height:88px; display:flex; align-items:center; justify-content:space-between; gap:24px; }
      .brand { display:inline-flex; text-decoration:none; }
      .brand img { width:68px; height:68px; object-fit:contain; filter:drop-shadow(0 8px 16px rgba(0,0,0,.2)); }
      .back { display:inline-flex; align-items:center; gap:10px; padding:11px 15px; border:1px solid rgba(255,255,255,.4); color:var(--white); text-decoration:none; font-weight:700; font-size:.84rem; transition:background .2s ease,color .2s ease; }
      .back:hover { color:var(--red); background:var(--white); }
      main { min-height:calc(100vh - 182px); display:grid; place-items:center; padding:76px 0; }
      .notice { position:relative; width:min(850px,100%); padding:clamp(44px,7vw,82px); overflow:hidden; background:#1c1b1e; color:var(--white); text-align:center; clip-path:polygon(0 0,96% 0,100% 7%,100% 100%,4% 100%,0 93%); box-shadow:0 24px 56px rgba(42,8,14,.2); }
      .notice::before { content:""; position:absolute; top:-155px; right:-123px; width:330px; height:330px; border:1px solid rgba(255,255,255,.18); border-radius:50%; }
      .notice::after { content:""; position:absolute; bottom:-168px; left:50%; width:430px; height:310px; background:linear-gradient(135deg,var(--red),var(--rose)); clip-path:polygon(50% 0,100% 100%,0 100%); transform:translateX(-50%); opacity:.9; }
      .notice > * { position:relative; z-index:1; }
      .eyebrow { display:inline-flex; align-items:center; gap:10px; margin:0 0 21px; color:#ffccd5; font:800 .75rem/1 "Manrope",sans-serif; letter-spacing:.17em; text-transform:uppercase; }
      .eyebrow::before, .eyebrow::after { content:""; width:24px; height:2px; background:currentColor; }
      h1 { max-width:690px; margin:0 auto; font:800 clamp(2rem,4.4vw,3.85rem)/1.04 "Manrope",sans-serif; letter-spacing:-.06em; text-transform:uppercase; }
      .lead { max-width:530px; margin:24px auto 32px; color:rgba(255,255,255,.76); }
      .home-button { display:inline-flex; align-items:center; gap:11px; padding:14px 20px; border:1px solid var(--white); color:var(--ink); background:var(--white); text-decoration:none; font-weight:800; transition:transform .2s ease,background .2s ease; }
      .home-button:hover { background:#ffe8ec; transform:translateY(-3px); }
      .footer { padding:20px 0; border-top:1px solid rgba(23,23,25,.1); color:#5c5b60; text-align:center; font:700 .68rem/1.25 "Manrope",sans-serif; letter-spacing:.06em; text-transform:uppercase; }
      @media (max-width:560px) { .wrap { width:min(100% - 32px,var(--max)); } .nav { min-height:79px; } .brand img { width:58px; height:58px; } .back { padding:9px 11px; font-size:.74rem; } main { min-height:calc(100vh - 167px); padding:42px 0; } .notice { padding:42px 25px; } h1 { font-size:clamp(1.85rem,9.3vw,2.8rem); } .eyebrow { font-size:.62rem; letter-spacing:.12em; } }
    </style>
  </head>
  <body>
    <div class="topline"></div>
    <header class="header"><div class="wrap nav"><a class="brand" href="index.html" aria-label="ETW Broker — strona główna"><img src="etw-broker-logo.png" alt="ETW Broker"></a><a class="back" href="index.html">← Strona główna</a></div></header>
    <main><div class="wrap"><section class="notice" aria-labelledby="wdrozenie-title"><p class="eyebrow">Panel klienta</p><h1 id="wdrozenie-title">Działamy nad wdrożeniem nowoczesnych aplikacji, zapraszamy wkrótce.</h1><p class="lead">Pracujemy nad wygodnym dostępem do Twoich spraw. Wróć niebawem.</p><a class="home-button" href="index.html">Strona główna <span aria-hidden="true">→</span></a></section></div></main>
    <footer class="footer"><div class="wrap">© 2026 ETW Broker. Wszelkie prawa zastrzeżone.</div></footer>
  </body>
</html>
